<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#091426">
        <title>Himanshu Verification</title>
          <style>
              * { box-sizing: border-box; }
                  body {
                        margin: 0; min-height: 100vh; display: grid; place-items: center;
                              padding: 20px; font-family: Arial, sans-serif; color: #f5f7ff;
                                    background: linear-gradient(145deg, #071225, #17294a);
                                        }
                                            .card {
                                                  width: min(440px, 100%); padding: 30px 22px; text-align: center;
                                                        border: 1px solid #34466a; border-radius: 22px;
                                                              background: #101c33; box-shadow: 0 18px 55px #0007;
                                                                  }
                                                                      .logo { font-size: 44px; }
                                                                          h1 { margin: 10px 0; font-size: 27px; }
                                                                              p { color: #bdc9df; line-height: 1.55; }
                                                                                  .status {
                                                                                        display: inline-block; padding: 7px 12px; border-radius: 30px;
                                                                                              background: #123e35; color: #7ef0bd; font-size: 13px;
                                                                                                  }
                                                                                                      #login { margin: 25px auto 10px; min-height: 45px; }
                                                                                                          #result {
                                                                                                                display: none; margin-top: 20px; padding: 15px;
                                                                                                                      border-radius: 12px; font-weight: bold; line-height: 1.5;
                                                                                                                          }
                                                                                                                              #result.ok { display: block; background: #123e35; color: #8af0bf; }
                                                                                                                                  #result.bad { display: block; background: #4a1722; color: #ff9ca8; }
                                                                                                                                      .muted { margin-top: 22px; font-size: 12px; color: #93a5c3; }
                                                                                                                                        </style>
                                                                                                                                        </head>
                                                                                                                                        <body>
                                                                                                                                          <main class="card">
                                                                                                                                              <div class="logo">🛡️</div>
                                                                                                                                                  <h1>Himanshu Verification</h1>
                                                                                                                                                      <p>Verify with your Telegram account to continue.</p>
                                                                                                                                                          <span class="status">● Verification Portal</span>

                                                                                                                                                              <div id="login">
                                                                                                                                                                    <!-- Replace YOUR_BOT_USERNAME with your Telegram bot username, without @.
                                                                                                                                                                               Telegram Login Widget also requires your website domain to be configured
                                                                                                                                                                                          through @BotFather using /setdomain. -->
                                                                                                                                                                                                <script async src="https://telegram.org/js/telegram-widget.js?22"
                                                                                                                                                                                                       data-telegram-login="HimanshuVerifySucessBot
                                                                                                                                                                
                                                                                                                                                                                                                data-size="large"
                                                                                                                                                                                                                        data-userpic="false"
                                                                                                                                                                                                                                data-request-access="write"
                                                                                                                                                                                                                                        data-onauth="onTelegramAuth(user)">
                                                                                                                                                                                                                                              </script>
                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                      <div id="result" role="status" aria-live="polite"></div>
                                                                                                                                                                                                                                                          <p class="muted">Designed By Himanshu</p>
                                                                                                                                                                                                                                                            </main>

                                                                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                                                                  async function onTelegramAuth(user) {
                                                                                                                                                                                                                                                                        const result = document.getElementById("result");
                                                                                                                                                                                                                                                                              result.className = "";
                                                                                                                                                                                                                                                                                    result.style.display = "block";
                                                                                                                                                                                                                                                                                          result.textContent = "Checking verification...";

                                                                                                                                                                                                                                                                                                try {
                                                                                                                                                                                                                                                                                                        // This endpoint must be implemented on your server (e.g. Flask app).
                                                                                                                                                                                                                                                                                                                const response = await fetch("/verify", {
                                                                                                                                                                                                                                                                                                                          method: "POST",
                                                                                                                                                                                                                                                                                                                                    headers: {"Content-Type": "application/json"},
                                                                                                                                                                                                                                                                                                                                              body: JSON.stringify(user)
                                                                                                                                                                                                                                                                                                                                                      });
                                                                                                                                                                                                                                                                                                                                                              const data = await response.json();

                                                                                                                                                                                                                                                                                                                                                                      result.textContent = data.message || "Verification failed.";
                                                                                                                                                                                                                                                                                                                                                                              result.className = data.ok ? "ok" : "bad";

                                                                                                                                                                                                                                                                                                                                                                                      if (data.blocked) {
                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("login").style.display = "none";
                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                              } catch (error) {
                                                                                                                                                                                                                                                                                                                                                                                                                      result.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                "Verification server is not connected. Please Please again later.";
                                                                                                                                                                                                                                                                                                                                                                                                                                        result.className = "bad";
                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    </html>
